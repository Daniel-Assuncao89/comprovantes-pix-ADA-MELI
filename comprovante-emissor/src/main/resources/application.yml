server:
  port: 8081
  error:
    # Mostra a mensagem da exceção na resposta de erro. Assim o 503 diz QUAL comprovante falhou
    # ("não foi possível gravar o comprovante <id>"). O Spring Boot esconde por padrão,
    # para não vazar detalhes internos: aqui a mensagem é nossa e é útil para o cliente.
    include-message: always

spring:
  application:
    name: comprovante-emissor
  jackson:
    property-naming-strategy: SNAKE_CASE   # JSON em snake_case (contrato do módulo)
    default-property-inclusion: non_null

# Aula 2 — onde está o gravador (passo remoto da SAGA) e quanto tempo esperar por ele
gravador:
  base-url: http://localhost:8082
  timeout-ms: 2000

# ------------------------------------------------------------------------------
# TODO (Aula 5) — a gravação deixa de ser REST e vira uma fila (RabbitMQ).
# ------------------------------------------------------------------------------

management:
  endpoints:
    web:
      exposure:
        include: health,info
